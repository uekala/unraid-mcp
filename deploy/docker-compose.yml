# Unraid MCP mit vorgeschaltetem Socket-Proxy.
# Der MCP-Server sieht den Docker-Socket nicht selbst, sondern nur den Proxy. Der lässt nur zu:
# Container auflisten und ansehen, Protokolle und Statistik lesen, starten, stoppen, neu starten.
# Anlegen, Löschen, exec, Images, Volumes und Netzwerke sind gesperrt.

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: unraid-mcp-docker
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [intern]
    # kein Port nach außen

  mcp:
    image: ghcr.io/uekala/unraid-mcp:latest
    container_name: unraid-mcp
    restart: unless-stopped
    depends_on: [docker-proxy]
    environment:
      MCP_TOKEN: ${MCP_TOKEN:?MCP_TOKEN in .env setzen}
      DOCKER_HOST: tcp://unraid-mcp-docker:2375
      SCHREIBEN_ERLAUBT: filen-webdav
      GESPERRT: kassensturz,stichtag
      TZ: Europe/Berlin
    volumes:
      - /mnt/user/appdata:/appdata
      - /boot/config/plugins/dockerMan/templates-user:/vorlagen:ro
    ports:
      - "8765:8765"
    networks: [intern]

networks:
  intern:
    name: unraid-mcp
